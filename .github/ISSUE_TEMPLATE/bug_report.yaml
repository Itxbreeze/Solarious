name: Bug report
description: Report an issue with Eclipsed Client
body:
  - type: input
    id: version
    attributes:
      label: Eclipsed Client version
      description: Find the version in the About tab.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Include the Windows version, expected behavior, and the error shown by Eclipsed Client. Keep private Roblox logs and launch links out of the report.
    validations:
      required: true
