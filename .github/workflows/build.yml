name: Build Eclipsed Client

on:
  pull_request:
  push:
    branches: [main, master]
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'
      - name: Build Windows x64 portable package
        shell: pwsh
        run: |
          $version = '1.0.0'
          if ($env:GITHUB_REF_TYPE -eq 'tag') {
            $version = $env:GITHUB_REF_NAME.Substring(1)
            if ($version -cnotmatch '^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$') { throw 'Use vMAJOR.MINOR.PATCH or a semver prerelease tag.' }
          }
          ./build-portable.ps1 -Version $version
      - uses: actions/upload-artifact@v7
        with:
          name: EclipsedClient-Portable
          path: dist/EclipsedClient-Portable.zip
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: EclipsedClient-Portable
      - name: Attach portable ZIP to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" EclipsedClient-Portable.zip --clobber
          else
            gh release create "$RELEASE_TAG" EclipsedClient-Portable.zip --verify-tag --generate-notes --prerelease=${{ contains(github.ref_name, '-') }}
          fi
